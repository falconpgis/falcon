name: Weekly data pipeline

on:
  schedule:
    - cron: '0 2 * * 1'   # 02:00 UTC every Monday
  workflow_dispatch:        # manual trigger for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pytrends requests pdfminer.six

      - name: Fetch Google Trends
        run: python scripts/fetch_trends.py
        continue-on-error: true

      - name: Fetch Eurasian signals (World Bank, BDI, currencies history)
        run: python scripts/fetch_eurasian.py
        continue-on-error: true

      - name: Fetch news intelligence (weekly deep scan)
        run: python scripts/fetch_news.py
        continue-on-error: true

      - name: Fetch UN Comtrade trade flows (annual data)
        env:
          COMTRADE_KEY: ${{ secrets.COMTRADE_KEY }}
        run: python scripts/fetch_comtrade.py
        continue-on-error: true

      - name: Fetch diaspora data (Gurdwaras OSM + Sikh MPs Wikidata)
        run: python scripts/fetch_gurdwaras.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name  "FALCON Bot"
          git config user.email "bot@falconpgis.github.io"
          git add \
            public/data/punjab_trends.json \
            public/data/eurasian_signals.json \
            public/data/geopolitics.json \
            public/data/comtrade.json \
            public/data/gurdwaras.geojson \
            public/data/sikh_mps.json \
            public/data/diaspora_summary.json \
            public/data/news/ \
            public/data/history/
          git diff --staged --quiet || git commit -m "chore: weekly signals refresh $(date -u +%Y-%m-%d)"
          git push
