name: Weekly data pipeline

on:
  schedule:
    - cron: '0 2 * * 1'   # 02:00 UTC every Monday
  workflow_dispatch:        # manual trigger for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: pip install pytrends requests

      - name: Fetch Google Trends
        run: python scripts/fetch_trends.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name  "FALCON Bot"
          git config user.email "bot@falconpgis.github.io"
          git add public/data/punjab_trends.json
          git diff --staged --quiet || git commit -m "chore: weekly trends refresh $(date -u +%Y-%m-%d)"
          git push
