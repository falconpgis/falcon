name: Daily data pipeline

on:
  schedule:
    - cron: '30 0 * * *'   # 00:30 UTC daily
  workflow_dispatch:         # manual trigger for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch NASA FIRMS fires
        env:
          FIRMS_MAP_KEY: ${{ secrets.FIRMS_MAP_KEY }}
        run: python scripts/fetch_firms.py

      - name: Fetch CPCB AQI
        run: python scripts/fetch_aqi.py
        continue-on-error: true

      - name: Fetch AGMARKNET mandi prices
        run: python scripts/fetch_mandi.py
        continue-on-error: true

      - name: Fetch currency rates
        run: python scripts/fetch_currencies.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name  "FALCON Bot"
          git config user.email "bot@falconpgis.github.io"
          git add public/data/punjab_fires.geojson \
                  public/data/punjab_aqi.json \
                  public/data/punjab_mandi.json \
                  public/data/currencies.json \
                  public/data/history/fires_timeseries.json \
                  public/data/history/aqi_timeseries.json \
                  public/data/history/mandi_timeseries.json
          git diff --staged --quiet || git commit -m "chore: daily data refresh $(date -u +%Y-%m-%d)"
          git push
