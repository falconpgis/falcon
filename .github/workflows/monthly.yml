name: Monthly data pipeline

on:
  schedule:
    - cron: '0 1 1 * *'   # 01:00 UTC on the 1st of each month
  workflow_dispatch:        # manual trigger for testing

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Fetch World Bank commodity prices
        run: python scripts/fetch_commodities.py
        continue-on-error: true

      - name: Commit updated data
        run: |
          git config user.name  "FALCON Bot"
          git config user.email "bot@falconpgis.github.io"
          git add public/data/commodities.json \
                  public/data/history/commodities_timeseries.json
          git diff --staged --quiet || git commit -m "chore: monthly commodities refresh $(date -u +%Y-%m)"
          git push
